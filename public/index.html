<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload CSV</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      margin-top: 50px;
      max-width: 600px;
    }
    .form-container {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .alert {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-container">
      <h2 class="text-center">Upload CSV File</h2>
      <form id="uploadForm" enctype="multipart/form-data">
        <div class="form-group">
          <label for="file">Choose CSV file</label>
          <input type="file" class="form-control-file" id="file" name="file" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Upload</button>
        <div id="message" class="alert mt-3"></div>
      </form>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      $('#uploadForm').on('submit', function (e) {
        e.preventDefault();

        var formData = new FormData(this);

        $.ajax({
          url: '/upload-csv',
          type: 'POST',
          data: formData,
          contentType: false,
          processData: false,
          success: function (data) {
            $('#message').removeClass('alert-danger').addClass('alert-success').text(data).show();
          },
          error: function (xhr, status, error) {
            $('#message').removeClass('alert-success').addClass('alert-danger').text(xhr.responseText).show();
          }
        });
      });
    });
  </script>
</body>
</html>
